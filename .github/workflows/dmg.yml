name: dmg
# À chaque poussée sur main : tests, puis construction de ReAble.app et du DMG, publiés dans la version « latest ».
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dmg-main
  cancel-in-progress: true          # une poussée plus récente remplace une construction encore en cours

permissions:
  contents: write                   # nécessaire pour mettre à jour la version « latest »

jobs:
  dmg:
    runs-on: macos-14               # Apple Silicon (arm64)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]" pyinstaller

      - name: Tests (pas de DMG si un test échoue)
        run: python -m pytest -q

      # Définitions livrées dans l'application : instantané de ReAble-library si le dépôt est lisible
      # (dépôt public, ou secret LIBRARY_TOKEN), sinon copie de test du dépôt.
      - name: Définitions de plugins (ReAble-library)
        id: library
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: flapflap/ReAble-library
          token: ${{ secrets.LIBRARY_TOKEN || github.token }}
          path: library

      # Signature de développeur + notarisation : uniquement si les secrets du dépôt existent (sinon signature ad hoc).
      # Secrets : MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD (certificat « Developer ID Application » exporté en .p12),
      #           APPLE_ID, APPLE_APP_PASSWORD (mot de passe d'application), APPLE_TEAM_ID.
      - name: Certificat de signature (trousseau temporaire)
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT_B64" ] || [ -z "$CERT_PASSWORD" ]; then
            echo "Pas de certificat configuré : signature ad hoc (avertissement Gatekeeper)."; exit 0
          fi
          KC="$RUNNER_TEMP/reable.keychain-db"; KCPASS="$(uuidgen)"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then echo "::error::Aucun certificat « Developer ID Application » dans le .p12"; exit 1; fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "NOTARY_APPLE_ID=$NOTARY_APPLE_ID" >> "$GITHUB_ENV"
          echo "NOTARY_TEAM_ID=$NOTARY_TEAM_ID" >> "$GITHUB_ENV"
          echo "::add-mask::$NOTARY_PASSWORD"
          echo "NOTARY_PASSWORD=$NOTARY_PASSWORD" >> "$GITHUB_ENV"
          echo "Signature avec : $IDENTITY"

      - name: Construire ReAble.app et le DMG
        env:
          PYTHON: python
          LIBRARY_DIR: ${{ github.workspace }}/library
        run: |
          VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          packaging/build_macos.sh "$VERSION"
          cp "dist/ReAble-$VERSION.dmg" dist/ReAble.dmg          # nom stable pour le lien de téléchargement

      - name: Conserver le DMG (artefact de l'exécution)
        uses: actions/upload-artifact@v4
        with:
          name: ReAble-dmg
          path: dist/ReAble-*.dmg
          retention-days: 30

      - name: Publier dans la version « latest »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/ReAble.dmg "dist/ReAble-$VERSION.dmg" \
            --prerelease --target "$GITHUB_SHA" \
            --title "ReAble — dernière version de main ($VERSION)" \
            --notes "Construit automatiquement à chaque poussée sur main (commit ${GITHUB_SHA::7}, Apple Silicon).

          Si macOS affiche « ReAble.app non ouvert » (version non signée par un développeur Apple) : clique sur « Terminé » (pas sur « Placer dans la corbeille »), puis Réglages Système > Confidentialité et sécurité > « Ouvrir quand même ». Ou dans le Terminal :
          \`xattr -dr com.apple.quarantine /Applications/ReAble.app\`"
